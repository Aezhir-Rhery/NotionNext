  <title>TypeScript HTML App</title>
<style>
  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    margin: 0;
    padding: 0;
    background: transparent;
  }

  html {
    overscroll-behavior: none;
    touch-action: none;
  }

  body > canvas:only-child {
    display: block;

    position: fixed;
    left: 0;
    bottom: 0;

    width: 300px;
    height: 300px;

    background: transparent;

    z-index: 9999;

    pointer-events: none;
  }
</style>
  <!-- Live2DCubismCore script -->
  <script src = "./Core/live2dcubismcore.js"></script>
  <!-- Build script -->
  <script type="module" crossorigin src="/live2d/assets/live2d-widget.js"></script>
